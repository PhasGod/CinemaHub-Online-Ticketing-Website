version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cinemahub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinemahub_db
      MYSQL_USER: cinemahub_user
      MYSQL_PASSWORD: cinemahub_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
